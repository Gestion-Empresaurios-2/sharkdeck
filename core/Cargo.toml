[package]
name = "sharkdeck-core"
version = "0.2.3"
edition = "2021"
license = "MIT"

[dependencies]
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
gif = "0.13"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "sharkdeck-cli"
path = "src/bin/cli.rs"
