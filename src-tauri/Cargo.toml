[package]
name = "sharkdeck"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "sharkdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
sharkdeck-core = { path = "../core" }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
